name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore K2Marketing.sln
      - run: dotnet build K2Marketing.sln -c Release --no-restore
      - name: Testes unitários
        run: dotnet test tests/K2Marketing.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Testes de integração (PostgreSQL via Testcontainers)
        run: dotnet test tests/K2Marketing.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: BackEnd/tests/**/TestResults/*.trx

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd/k2-marketing-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/k2-marketing-web/package-lock.json
      - run: npm ci
      - name: Testes unitários (Karma + Chrome headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npx ng build --configuration production

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
        run: docker compose build
