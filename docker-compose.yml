name: k2-marketing

services:
  k2-marketing-postgres:
    image: postgres:16-alpine
    container_name: k2-marketing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-k2marketing}
      POSTGRES_USER: ${POSTGRES_USER:-k2marketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - k2-marketing-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-k2marketing} -d ${POSTGRES_DB:-k2marketing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  k2-marketing-api:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: k2-marketing-api
    depends_on:
      k2-marketing-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=k2-marketing-postgres;Port=5432;Database=${POSTGRES_DB:-k2marketing};Username=${POSTGRES_USER:-k2marketing};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      Cors__Origins__0: http://localhost:${WEB_PORT:-4290}
      Database__MigrateOnStartup: "true"
      Database__Seed: ${SEED_DEMO_DATA:-true}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Storage__RootPath: /app/storage
    volumes:
      - k2-marketing-storage:/app/storage
    ports:
      - "${API_PORT:-5090}:8080"

  k2-marketing-web:
    build:
      context: ./FrontEnd/k2-marketing-web
      dockerfile: Dockerfile
    container_name: k2-marketing-web
    depends_on:
      - k2-marketing-api
    ports:
      - "${WEB_PORT:-4290}:80"

volumes:
  k2-marketing-pgdata:
  k2-marketing-storage:
