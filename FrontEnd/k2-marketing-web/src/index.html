<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>K2 Marketing</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="K2 Marketing — gestão de marketing digital e tráfego pago">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script>
    // Aplica o tema salvo antes da renderização (evita "flash" de tema claro).
    try {
      var t = localStorage.getItem('k2m.theme');
      var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
