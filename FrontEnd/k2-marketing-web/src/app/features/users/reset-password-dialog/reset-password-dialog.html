<h2 mat-dialog-title>{{ 'users.resetPassword' | transloco }}</h2>
<mat-dialog-content>
  <p class="muted">{{ data.fullName }} · {{ data.email }}</p>
  <mat-form-field class="full"><mat-label>{{ 'users.newPassword' | transloco }}</mat-label><input matInput type="password" [formControl]="password" autocomplete="new-password" />
    <mat-hint>{{ 'users.passwordPolicy' | transloco }}</mat-hint></mat-form-field>
  <p class="note"><mat-icon>info_outline</mat-icon>{{ 'users.resetNote' | transloco }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ 'common.cancel' | transloco }}</button>
  <button mat-flat-button (click)="save()" [disabled]="password.invalid">{{ 'common.save' | transloco }}</button>
</mat-dialog-actions>
