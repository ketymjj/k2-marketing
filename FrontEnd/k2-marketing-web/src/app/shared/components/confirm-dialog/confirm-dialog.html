<h2 mat-dialog-title>{{ data.title | transloco }}</h2>
<mat-dialog-content><p class="confirm-text">{{ data.message | transloco: data.params }}</p></mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ 'common.cancel' | transloco }}</button>
  <button mat-flat-button [class.btn-danger]="data.danger" (click)="ref.close(true)">{{ (data.confirm ?? 'common.confirm') | transloco }}</button>
</mat-dialog-actions>
